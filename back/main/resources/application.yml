spring:
  application:
    name: rider-oasis

  # Database Configuration (Supabase PostgreSQL)
  datasource:
    # 사용자님의 프로젝트 ID(wyxtvpsnkietlbfxlins)가 적용된 주소입니다.
    url: jdbc:postgresql://db.wyxtvpsnkietlbfxlins.supabase.co:5432/postgres
    username: postgres
    # ⚠️ 중요: 아래 작은따옴표('') 사이에 Supabase DB 비밀번호를 꼭 입력해주세요!
    password: 'Puremay0826@'
    driver-class-name: org.postgresql.Driver

  # JPA Configuration
  jpa:
    hibernate:
      # create-drop은 매번 데이터를 날리므로, update로 변경했습니다.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # PostgreSQL 방언으로 변경
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Jackson (JSON)
  jackson:
    serialization:
      fail-on-empty-beans: false

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api

# JWT Configuration
jwt:
  secret: rider-oasis-jwt-secret-key-for-hs512-must-be-very-long-at-least-64-characters-or-512-bits-gyeonggi-shade-road-2024
  expiration: 86400000  # 24 hours in milliseconds

# Logging
logging:
  level:
    com.rideroasis: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG