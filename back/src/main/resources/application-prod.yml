# Production Configuration (Oracle/MySQL)
spring:
  # Uncomment and configure for Oracle
  # datasource:
  #   url: jdbc:oracle:thin:@localhost:1521:xe
  #   driver-class-name: oracle.jdbc.OracleDriver
  #   username: your_username
  #   password: your_password

  # Uncomment and configure for MySQL
  # datasource:
  #   url: jdbc:mysql://localhost:3306/rideroasis?useSSL=false&serverTimezone=UTC
  #   driver-class-name: com.mysql.cj.jdbc.Driver
  #   username: your_username
  #   password: your_password

  jpa:
    hibernate:
      ddl-auto: validate  # Use 'validate' or 'none' in production
    show-sql: false
    properties:
      hibernate:
        # For Oracle
        # dialect: org.hibernate.dialect.Oracle12cDialect
        # For MySQL
        # dialect: org.hibernate.dialect.MySQL8Dialect

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://*.vercel.app}

logging:
  level:
    com.rideroasis: INFO
    org.springframework.security: WARN
