spring:
  application:
    name: rider-oasis

  # DataSource Configuration (Supabase/PostgreSQL)
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Jackson (JSON)
  jackson:
    serialization:
      fail-on-empty-beans: false

# CORS (Default for local development)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://rider-oasis.vercel.app,https://rider-oasis-project.vercel.app}

# Server Configuration
server:
  port: ${PORT:8080}

# JWT Configuration (HS512 requires at least 512 bits = 64 bytes)
jwt:
  secret: ${JWT_SECRET:rider-oasis-jwt-secret-key-for-hs512-must-be-very-long-at-least-64-characters-or-512-bits-gyeonggi-shade-road-2024-local-dev-only}
  expiration: 86400000  # 24 hours in milliseconds

# Logging
logging:
  level:
    com.rideroasis: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

# TMAP API
tmap:
  api:
    key: ${TMAP_API_KEY}
