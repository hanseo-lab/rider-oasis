spring:
  application:
    name: rider-oasis

  # H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:rideroasis
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # H2 Console (for development)
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # Jackson (JSON)
  jackson:
    serialization:
      fail-on-empty-beans: false

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api

# JWT Configuration (HS512 requires at least 512 bits = 64 bytes)
jwt:
  secret: rider-oasis-jwt-secret-key-for-hs512-must-be-very-long-at-least-64-characters-or-512-bits-gyeonggi-shade-road-2024
  expiration: 86400000  # 24 hours in milliseconds

# Logging
logging:
  level:
    com.rideroasis: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
